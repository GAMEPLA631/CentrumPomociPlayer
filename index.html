<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Studio GPM - Python (Ursina Bridge) & HTML5 Studio</title>
    <!-- Three.js pre 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Pyodide (Python 3.11 WebAssembly) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030308;
            --panel-bg: rgba(10, 12, 24, 0.88);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --neon-pink: #ff007b;
            --neon-green: #00ff66;
            --text-main: #f0f4fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(5, 5, 15, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            z-index: 10;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .status-badge {
            font-size: 0.75rem;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            font-family: 'JetBrains Mono', monospace;
        }

        .studio-container {
            display: grid;
            grid-template-columns: 490px 1fr;
            flex: 1;
            height: calc(100vh - 55px);
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            z-index: 5;
            overflow: hidden;
        }

        .engine-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .select-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            outline: none;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 230px;
        }

        .editor-container label {
            font-size: 0.72rem;
            color: var(--neon-purple);
            font-family: 'JetBrains Mono', monospace;
        }

        .code-editor {
            flex: 1;
            background: #020208;
            border: 1px solid rgba(176, 0, 255, 0.4);
            border-radius: 6px;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 10px;
            resize: none;
            outline: none;
            line-height: 1.4;
            white-space: pre;
            tab-size: 4;
        }

        .code-editor:focus {
            border-color: var(--neon-blue);
        }

        .terminal {
            height: 110px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #aaa;
            overflow-y: auto;
        }

        .terminal .log-success { color: var(--neon-green); }
        .terminal .log-error { color: var(--neon-pink); }
        .terminal .log-info { color: var(--neon-blue); }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(176, 0, 255, 0.2));
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .btn-record {
            border-color: var(--neon-pink);
            background: linear-gradient(135deg, rgba(255, 0, 123, 0.2), rgba(176, 0, 255, 0.2));
        }

        .btn-record:hover {
            background: linear-gradient(135deg, var(--neon-pink), #ff5500);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 123, 0.7);
        }

        .btn-record.recording {
            animation: pulseRecord 1s infinite alternate;
            background: var(--neon-pink) !important;
            color: white !important;
        }

        @keyframes pulseRecord {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff007b; }
            100% { transform: scale(1.02); box-shadow: 0 0 25px #ff007b; }
        }

        .viewport-area {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0e0e22 0%, #020205 100%);
            overflow: hidden;
        }

        #viewport-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        #html-frame-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            border: none;
            background: transparent;
        }

        .hud-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--neon-blue);
            pointer-events: none;
            z-index: 10;
        }

        .record-progress-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--neon-pink);
            padding: 10px 20px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            box-shadow: 0 0 25px rgba(255, 0, 123, 0.4);
            z-index: 20;
        }

        .progress-bar-inner {
            width: 120px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--neon-pink);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✦ ANIME STUDIO GPM // 3D PYTHON ENGINE</div>
        <div class="status-badge" id="runtimeStatus">● URSINA BRIDGE READY</div>
    </header>

    <div class="studio-container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="engine-tabs">
                <button class="tab-btn active" id="tabPython" onclick="setMode('python')">🐍 PYTHON (URSINA 3D)</button>
                <button class="tab-btn" id="tabHTML" onclick="setMode('html')">🌐 HTML5 / JS / 3D</button>
            </div>

            <select class="select-box" id="presetSelect" onchange="loadPreset()"></select>

            <div class="editor-container">
                <label id="editorLabel">🐍 PYTHON CODE (URSINA & 3D SYNTAX PODPOROVANÝ)</label>
                <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
            </div>

            <div class="terminal" id="terminalOutput">
                <div class="log-info">> Systém pripravený. Ursina 3D Bridge je aktívny.</div>
            </div>

            <div class="btn-group">
                <button class="btn" id="btnRun" onclick="runCode()">▶ SPUSTIŤ KÓD</button>
                <button class="btn btn-record" id="btnRecord" onclick="startRecording(6)">⏺ STIAHNUŤ MP4</button>
            </div>
        </div>

        <!-- 3D VIEWPORT -->
        <div class="viewport-area">
            <canvas id="viewport-3d"></canvas>
            <iframe id="html-frame-container"></iframe>

            <div class="hud-overlay">
                <div>ENGINE: <span id="hudMode" style="color: #fff;">PYTHON URSINA</span></div>
                <div>RENDER: <span style="color: var(--neon-green);">60 FPS</span></div>
            </div>

            <div class="record-progress-box" id="recordBox">
                <span>EXPORTUJEM MP4...</span>
                <div class="progress-bar-inner">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="recordTimer">0.0s / 6.0s</span>
            </div>
        </div>

    </div>

    <script>
        let currentMode = 'python';
        let pyodideInstance = null;
        let animationFrameId = null;

        // Three.js scéna
        const canvas = document.getElementById('viewport-3d');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.z = 15;

        let pythonEntities = [];
        let pythonUpdateFunc = null;

        const terminal = document.getElementById('terminalOutput');
        const editor = document.getElementById('codeEditor');
        const presetSelect = document.getElementById('presetSelect');
        const htmlFrame = document.getElementById('html-frame-container');
        const runtimeStatus = document.getElementById('runtimeStatus');

        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `log-${type}`;
            el.textContent = `> ${msg}`;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // --- 1. PYTHON ENGINE & URSINA 3D BRIDGE DEFINITION ---
        async function initPythonEngine() {
            try {
                runtimeStatus.textContent = "⏳ NAČÍTAVAM PYTHON RUNTIME...";
                log("Inicializujem Python WebAssembly engine...", "info");
                pyodideInstance = await loadPyodide({
                    stdout: (text) => log(text, 'info'),
                    stderr: (text) => log(text, 'error')
                });

                // Vytvorenie vstavaného Ursina modulu priamo v Pythone!
                await pyodideInstance.runPythonAsync(`
import js, math

class Color:
    def __init__(self):
        self.cyan = 0x00f0ff
        self.pink = 0xff007b
        self.purple = 0xb000ff
        self.green = 0x00ff66
        self.white = 0xffffff
        self.yellow = 0xffd700
    def rgb(self, r, g, b):
        return (int(r * 255) << 16) + (int(g * 255) << 8) + int(b * 255)

color = Color()

class Entity:
    def __init__(self, model='cube', color=0x00f0ff, scale=1, wireframe=True, position=(0,0,0)):
        self.model_type = model
        self.color = color
        self.wireframe = wireframe
        self.x, self.y, self.z = position
        self.scale_val = scale
        self.rotation_x = 0
        self.rotation_y = 0
        self.rotation_z = 0
        
        # Registrácia entity do JavaScript Three.js scény
        self.id = js.createJsEntity(model, color, wireframe, self.x, self.y, self.z, scale)

    def sync(self):
        js.updateJsEntity(self.id, self.x, self.y, self.z, self.rotation_x, self.rotation_y, self.rotation_z, self.scale_val)

class Ursina:
    def __init__(self):
        js.reset3DScene()
    def run(self):
        pass

# Sprístupnenie ako ursina balíček
import sys, types
ursina_module = types.ModuleType('ursina')
ursina_module.Entity = Entity
ursina_module.Ursina = Ursina
ursina_module.color = color
ursina_module.math = math
sys.modules['ursina'] = ursina_module
`);
                runtimeStatus.textContent = "● PYTHON URSINA ONLINE";
                log("Ursina 3D Engine úspešne prepojený!", "success");
            } catch (err) {
                log("Chyba štartu: " + err, "error");
            }
        }
        initPythonEngine();

        // --- 2. JAVASCRIPT THREE.JS BRIDGE FUNCTIONS (Volané z Pythonu) ---
        let entityCounter = 0;
        let meshMap = {};

        window.reset3DScene = function() {
            for (let id in meshMap) {
                scene.remove(meshMap[id]);
            }
            meshMap = {};
            entityCounter = 0;
            scene.fog = new THREE.FogExp2(0x030308, 0.025);
        };

        window.createJsEntity = function(model, col, wireframe, x, y, z, scale) {
            let geo;
            if (model === 'cube') geo = new THREE.BoxGeometry(scale, scale, scale);
            else if (model === 'sphere') geo = new THREE.SphereGeometry(scale, 24, 24);
            else if (model === 'torus') geo = new THREE.TorusGeometry(scale, scale * 0.25, 16, 60);
            else if (model === 'knot') geo = new THREE.TorusKnotGeometry(scale, scale * 0.3, 100, 16);
            else geo = new THREE.BoxGeometry(scale, scale, scale);

            const mat = new THREE.MeshBasicMaterial({ color: col, wireframe: wireframe });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            const id = entityCounter++;
            meshMap[id] = mesh;
            return id;
        };

        window.updateJsEntity = function(id, x, y, z, rx, ry, rz, s) {
            const mesh = meshMap[id];
            if (mesh) {
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.scale.set(s, s, s);
            }
        };

        // --- 3. PREDPRIPRAVENÉ KÓDY (PRESETS) ---
        const presets = {
            python: {
                "🌀 Ursina 3D Hypnotický Tunel": `from ursina import *
import math

app = Ursina()

# Vytvoríme kruhy tvoriace hypnotický tunel
rings = []
for i in range(35):
    ring = Entity(
        model='torus',
        color=color.pink if i % 2 == 0 else color.cyan,
        scale=4 + math.sin(i * 0.3) * 1.5,
        wireframe=True,
        position=(0, 0, -i * 3)
    )
    rings.append(ring)

core = Entity(model='knot', color=color.green, scale=1.5, wireframe=True)

# Update funkcia, ktorá beží každý frame
time_val = 0
def update():
    global time_val
    time_val += 0.03
    
    core.rotation_x += 0.02
    core.rotation_y += 0.04
    core.sync()
    
    for idx, r in enumerate(rings):
        r.rotation_z = time_val * 0.8 + idx * 0.1
        r.z = ((r.z + 10 + time_val * 4) % 105) - 95
        r.sync()

app.run()
`,
                "🌐 Ursina Kybernetický Multiverz": `from ursina import *
import math, random

app = Ursina()

cubes = []
for i in range(50):
    c = Entity(
        model='cube',
        color=color.cyan if i % 2 == 0 else color.purple,
        scale=random.uniform(0.8, 2.5),
        wireframe=True,
        position=(
            random.uniform(-18, 18),
            random.uniform(-10, 10),
            random.uniform(-30, 5)
        )
    )
    cubes.append(c)

t = 0
def update():
    global t
    t += 0.02
    for i, c in enumerate(cubes):
        c.rotation_x += 0.02
        c.rotation_y += 0.03
        c.y += math.sin(t + i) * 0.03
        c.sync()

app.run()
`
            },
            html: {
                "🌀 3D Hypnotic Three.js Matrix": `<!DOCTYPE html>
<html>
<head>
<style> body { margin:0; overflow:hidden; background:#000; } </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 10;

  const rings = [];
  for(let i = 0; i < 40; i++) {
    const geo = new THREE.TorusGeometry(4 + Math.sin(i * 0.3) * 1.5, 0.08, 16, 80);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(i / 40, 1, 0.5),
      wireframe: true
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.position.z = -i * 3;
    scene.add(ring);
    rings.push(ring);
  }

  function loop(t) {
    requestAnimationFrame(loop);
    rings.forEach((r, idx) => {
      r.rotation.z = t * 0.001 + idx * 0.05;
      r.position.z = ((r.position.z + 10 + t * 0.01) % 120) - 110;
    });
    renderer.render(scene, camera);
  }
  loop(0);
<\/script>
</body>
</html>`
            }
        };

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tabPython').classList.toggle('active', mode === 'python');
            document.getElementById('tabHTML').classList.toggle('active', mode === 'html');
            document.getElementById('hudMode').textContent = mode === 'python' ? 'PYTHON URSINA' : 'HTML5 / JS';
            
            presetSelect.innerHTML = '';
            for (let name in presets[mode]) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                presetSelect.appendChild(opt);
            }
            loadPreset();
        }

        function loadPreset() {
            const selected = presetSelect.value;
            if (presets[currentMode][selected]) {
                editor.value = presets[currentMode][selected];
            }
        }

        setMode('python');

        // --- 4. EXEKÚCIA KÓDU (RUN) ---
        function runCode() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const code = editor.value;
            log(`Spúšťam ${currentMode.toUpperCase()} kód...`, 'info');

            if (currentMode === 'python') {
                htmlFrame.style.display = "none";
                canvas.style.display = "block";

                if (!pyodideInstance) {
                    log("Python sa ešte načítava, počkaj sekundu...", "error");
                    return;
                }

                try {
                    reset3DScene();
                    pyodideInstance.runPython(code);
                    
                    // Slučka pre animáciu (volá `update()` v Pythone ak existuje)
                    function renderLoop() {
                        try {
                            if (pyodideInstance.globals.get('update')) {
                                pyodideInstance.runPython("if 'update' in globals(): update()");
                            }
                        } catch (err) {
                            log(`Python Error: ${err}`, "error");
                            return;
                        }
                        renderer.render(scene, camera);
                        animationFrameId = requestAnimationFrame(renderLoop);
                    }
                    renderLoop();
                    log("Ursina 3D kód úspešne beží!", "success");

                } catch (err) {
                    log(`Python Error: ${err}`, "error");
                }

            } else if (currentMode === 'html') {
                canvas.style.display = "none";
                htmlFrame.style.display = "block";
                htmlFrame.srcdoc = code;
                log("HTML/JS animácia spustená!", "success");
            }
        }

        // --- 5. MP4 VIDEO RECORDER & DOWNLOAD ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function startRecording(durationSeconds = 6) {
            if (isRecording) return;
            isRecording = true;
            recordedChunks = [];

            const btnRecord = document.getElementById('btnRecord');
            const recordBox = document.getElementById('recordBox');
            const progressFill = document.getElementById('progressFill');
            const recordTimer = document.getElementById('recordTimer');

            btnRecord.classList.add('recording');
            btnRecord.textContent = "⏺ NAHRÁVAM...";
            recordBox.style.display = "flex";

            let stream;
            if (currentMode === 'python') {
                stream = canvas.captureStream(60);
            } else {
                try {
                    const iframeCanvas = htmlFrame.contentDocument.querySelector('canvas');
                    stream = iframeCanvas ? iframeCanvas.captureStream(60) : canvas.captureStream(60);
                } catch(e) {
                    stream = canvas.captureStream(60);
                }
            }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ANIME_STUDIO_URSINA_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                btnRecord.classList.remove('recording');
                btnRecord.textContent = "⏺ STIAHNUŤ MP4";
                recordBox.style.display = "none";
                isRecording = false;
                log("Video MP4 úspešne vygenerované a stiahnuté!", "success");
            };

            mediaRecorder.start();

            let elapsed = 0;
            const interval = 100;
            const timer = setInterval(() => {
                elapsed += interval / 1000;
                progressFill.style.width = ((elapsed / durationSeconds) * 100) + "%";
                recordTimer.textContent = `${elapsed.toFixed(1)}s / ${durationSeconds}.0s`;

                if (elapsed >= durationSeconds) {
                    clearInterval(timer);
                    mediaRecorder.stop();
                }
            }, interval);
        }

        window.addEventListener('resize', () => {
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });
    </script>
</body>
</html>
