<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Studio GPM - Ultra HD 16:9 Video Engine</title>
    <!-- Three.js (3D Grafika) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Pyodide (Python 3.11 WebAssembly) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030308;
            --panel-bg: rgba(10, 12, 24, 0.9);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --neon-pink: #ff007b;
            --neon-green: #00ff66;
            --text-main: #f0f4fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(5, 5, 15, 0.98);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            z-index: 10;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .status-badge {
            font-size: 0.72rem;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            font-family: 'JetBrains Mono', monospace;
        }

        .studio-container {
            display: grid;
            grid-template-columns: 460px 1fr;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            z-index: 5;
            overflow-y: auto;
        }

        .engine-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .select-box, .input-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            outline: none;
        }

        /* RENDER SETTINGS PANEL */
        .render-settings {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(176, 0, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-title {
            font-size: 0.72rem;
            color: var(--neon-pink);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            align-items: center;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .time-group label {
            font-size: 0.65rem;
            color: #aaa;
            font-family: 'JetBrains Mono', monospace;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 180px;
        }

        .editor-container label {
            font-size: 0.7rem;
            color: var(--neon-purple);
            font-family: 'JetBrains Mono', monospace;
        }

        .code-editor {
            flex: 1;
            background: #020208;
            border: 1px solid rgba(176, 0, 255, 0.4);
            border-radius: 6px;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 10px;
            resize: none;
            outline: none;
            line-height: 1.4;
            white-space: pre;
            tab-size: 4;
        }

        .code-editor:focus { border-color: var(--neon-blue); }

        .terminal {
            height: 90px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #aaa;
            overflow-y: auto;
        }

        .terminal .log-success { color: var(--neon-green); }
        .terminal .log-error { color: var(--neon-pink); }
        .terminal .log-info { color: var(--neon-blue); }

        .btn-group { display: flex; gap: 8px; }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(176, 0, 255, 0.2));
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .btn-record {
            border-color: var(--neon-pink);
            background: linear-gradient(135deg, rgba(255, 0, 123, 0.2), rgba(176, 0, 255, 0.2));
        }

        .btn-record:hover {
            background: linear-gradient(135deg, var(--neon-pink), #ff5500);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 123, 0.7);
        }

        .btn-record.recording {
            animation: pulseRecord 1s infinite alternate;
            background: var(--neon-pink) !important;
            color: white !important;
        }

        @keyframes pulseRecord {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff007b; }
            100% { transform: scale(1.02); box-shadow: 0 0 25px #ff007b; }
        }

        /* 16:9 CINEMA VIEWPORT */
        .viewport-area {
            position: relative;
            width: 100%;
            height: 100%;
            background: #010104;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen-16-9 {
            width: 100%;
            max-width: calc((100vh - 90px) * (16 / 9));
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        #viewport-3d {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        #html-frame-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            border: none;
            background: transparent;
        }

        .hud-overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--neon-blue);
            pointer-events: none;
            z-index: 10;
        }

        .record-progress-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--neon-pink);
            padding: 10px 24px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            box-shadow: 0 0 30px rgba(255, 0, 123, 0.5);
            z-index: 20;
        }

        .progress-bar-inner {
            width: 150px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--neon-pink);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✦ ANIME STUDIO GPM // 16:9 ULTRA HD ENGINE</div>
        <div class="status-badge" id="runtimeStatus">● URSINA 3D READY</div>
    </header>

    <div class="studio-container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="engine-tabs">
                <button class="tab-btn active" id="tabPython" onclick="setMode('python')">🐍 PYTHON (URSINA)</button>
                <button class="tab-btn" id="tabHTML" onclick="setMode('html')">🌐 HTML5 / 3D</button>
            </div>

            <!-- RENDER NASTAVENIA -->
            <div class="render-settings">
                <div class="settings-title">⚙ NASTAVENIE ČASU & KVALITY MP4</div>
                <div class="time-inputs">
                    <div class="time-group">
                        <label>MINÚTY:</label>
                        <input type="number" id="videoMin" class="input-box" value="0" min="0" max="60">
                    </div>
                    <div class="time-group">
                        <label>SEKUNDY:</label>
                        <input type="number" id="videoSec" class="input-box" value="10" min="1" max="59">
                    </div>
                    <div class="time-group">
                        <label>KVALITA:</label>
                        <select id="videoRes" class="select-box">
                            <option value="1080p">1080p FHD</option>
                            <option value="1440p">2K Ultra</option>
                        </select>
                    </div>
                </div>
            </div>

            <select class="select-box" id="presetSelect" onchange="loadPreset()"></select>

            <div class="editor-container">
                <label id="editorLabel">🐍 PYTHON CODE (16:9 OSTRÝ RENDER)</label>
                <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
            </div>

            <div class="terminal" id="terminalOutput">
                <div class="log-info">> Systém pripravený na Full HD 16:9 export.</div>
            </div>

            <div class="btn-group">
                <button class="btn" id="btnRun" onclick="runCode()">▶ SPUSTIŤ KÓD</button>
                <button class="btn btn-record" id="btnRecord" onclick="handleRecordClick()">⏺ EXPORT DO MP4</button>
            </div>
        </div>

        <!-- 16:9 VIEWPORT -->
        <div class="viewport-area">
            <div class="screen-16-9">
                <canvas id="viewport-3d"></canvas>
                <iframe id="html-frame-container"></iframe>

                <div class="hud-overlay">
                    <div>ASPECT: <span style="color: #fff;">16:9 OBDFĹŽNIK</span></div>
                    <div>SHARPNESS: <span style="color: var(--neon-green);">ULTRA (MSAA 4X)</span></div>
                    <div>FPS: <span style="color: var(--neon-blue);">60.0</span></div>
                </div>

                <div class="record-progress-box" id="recordBox">
                    <span>GENEROVANIE MP4...</span>
                    <div class="progress-bar-inner">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="recordTimer">00:00 / 00:00</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentMode = 'python';
        let pyodideInstance = null;
        let animationFrameId = null;

        // Nastavenie Three.js pre OSTRÝ 16:9 RENDER
        const canvas = document.getElementById('viewport-3d');
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            antialias: true, 
            preserveDrawingBuffer: true,
            powerPreference: "high-performance"
        });

        // Pevné Full HD rozlíšenie 1920x1080 pre nulové rozmazanie
        renderer.setSize(1920, 1080, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 16 / 9, 0.1, 1000);
        camera.position.z = 15;

        const terminal = document.getElementById('terminalOutput');
        const editor = document.getElementById('codeEditor');
        const presetSelect = document.getElementById('presetSelect');
        const htmlFrame = document.getElementById('html-frame-container');
        const runtimeStatus = document.getElementById('runtimeStatus');

        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `log-${type}`;
            el.textContent = `> ${msg}`;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // --- 1. PYTHON & URSINA ENGINE ---
        async function initPythonEngine() {
            try {
                runtimeStatus.textContent = "⏳ NAČÍTAVAM ENGINE...";
                log("Inicializujem Full HD Python WebAssembly...", "info");
                pyodideInstance = await loadPyodide({
                    stdout: (text) => log(text, 'info'),
                    stderr: (text) => log(text, 'error')
                });

                await pyodideInstance.runPythonAsync(`
import js, math

class Color:
    def __init__(self):
        self.cyan = 0x00f0ff
        self.pink = 0xff007b
        self.purple = 0xb000ff
        self.green = 0x00ff66
        self.white = 0xffffff
        self.gold = 0xffd700
    def rgb(self, r, g, b):
        return (int(r * 255) << 16) + (int(g * 255) << 8) + int(b * 255)

color = Color()

class Entity:
    def __init__(self, model='cube', color=0x00f0ff, scale=1, wireframe=True, position=(0,0,0)):
        self.model_type = model
        self.color = color
        self.wireframe = wireframe
        self.x, self.y, self.z = position
        self.scale_val = scale
        self.rotation_x = 0
        self.rotation_y = 0
        self.rotation_z = 0
        self.id = js.createJsEntity(model, color, wireframe, self.x, self.y, self.z, scale)

    def sync(self):
        js.updateJsEntity(self.id, self.x, self.y, self.z, self.rotation_x, self.rotation_y, self.rotation_z, self.scale_val)

class Ursina:
    def __init__(self):
        js.reset3DScene()
    def run(self):
        pass

import sys, types
ursina_module = types.ModuleType('ursina')
ursina_module.Entity = Entity
ursina_module.Ursina = Ursina
ursina_module.color = color
ursina_module.math = math
sys.modules['ursina'] = ursina_module
`);
                runtimeStatus.textContent = "● PYTHON 16:9 ONLINE";
                log("Ursina 3D Engine pripravený v 16:9 rozlíšení!", "success");
            } catch (err) {
                log("Chyba: " + err, "error");
            }
        }
        initPythonEngine();

        // Three.js Bridge
        let entityCounter = 0;
        let meshMap = {};

        window.reset3DScene = function() {
            for (let id in meshMap) scene.remove(meshMap[id]);
            meshMap = {};
            entityCounter = 0;
            scene.fog = new THREE.FogExp2(0x010104, 0.022);
        };

        window.createJsEntity = function(model, col, wireframe, x, y, z, scale) {
            let geo;
            if (model === 'cube') geo = new THREE.BoxGeometry(scale, scale, scale);
            else if (model === 'sphere') geo = new THREE.SphereGeometry(scale, 32, 32);
            else if (model === 'torus') geo = new THREE.TorusGeometry(scale, scale * 0.28, 20, 80);
            else if (model === 'knot') geo = new THREE.TorusKnotGeometry(scale, scale * 0.35, 120, 20);
            else geo = new THREE.BoxGeometry(scale, scale, scale);

            const mat = new THREE.MeshBasicMaterial({ color: col, wireframe: wireframe });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            const id = entityCounter++;
            meshMap[id] = mesh;
            return id;
        };

        window.updateJsEntity = function(id, x, y, z, rx, ry, rz, s) {
            const mesh = meshMap[id];
            if (mesh) {
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.scale.set(s, s, s);
            }
        };

        // --- 2. PRESETS ---
        const presets = {
            python: {
                "🌀 16:9 Hypnotický Laserový Tunel": `from ursina import *
import math

app = Ursina()

# 16:9 Hypnotická Geometria
rings = []
for i in range(40):
    ring = Entity(
        model='torus',
        color=color.pink if i % 2 == 0 else color.cyan,
        scale=5.5 + math.sin(i * 0.25) * 2.0,
        wireframe=True,
        position=(0, 0, -i * 2.8)
    )
    rings.append(ring)

core = Entity(model='knot', color=color.green, scale=2.0, wireframe=True)

t = 0
def update():
    global t
    t += 0.03
    
    core.rotation_x += 0.02
    core.rotation_y += 0.04
    core.sync()
    
    for idx, r in enumerate(rings):
        r.rotation_z = t * 0.6 + idx * 0.08
        r.z = ((r.z + 10 + t * 5.0) % 115) - 105
        r.sync()

app.run()
`,
                "✨ 16:9 Kybernetická Kvantová Dimenzia": `from ursina import *
import math, random

app = Ursina()

cubes = []
for i in range(60):
    c = Entity(
        model='cube',
        color=color.cyan if i % 3 == 0 else (color.pink if i % 3 == 1 else color.purple),
        scale=random.uniform(0.6, 2.0),
        wireframe=True,
        position=(
            random.uniform(-22, 22),
            random.uniform(-12, 12),
            random.uniform(-35, 5)
        )
    )
    cubes.append(c)

t = 0
def update():
    global t
    t += 0.025
    for i, c in enumerate(cubes):
        c.rotation_x += 0.02
        c.rotation_y += 0.03
        c.y += math.sin(t * 2 + i) * 0.04
        c.sync()

app.run()
`
            },
            html: {
                "🌀 16:9 Ultra-HD Three.js Vortex": `<!DOCTYPE html>
<html>
<head>
<style> body { margin:0; overflow:hidden; background:#000; } canvas { width:100vw; height:100vh; display:block; } </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1920, 1080, false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 16 / 9, 0.1, 1000);
  camera.position.z = 12;

  const rings = [];
  for(let i = 0; i < 45; i++) {
    const geo = new THREE.TorusGeometry(5 + Math.sin(i * 0.25) * 1.8, 0.08, 16, 80);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(i / 45, 1, 0.5),

    });
    const ring = new THREE.Mesh(geo, mat);

    scene.add(ring);

  }

  function loop(t) {
    requestAnimationFrame(loop);
    rings.forEach((r, idx) => {
      r.rotation.z = t * 0.001 + idx * 0.04;

    });
    renderer.render(scene, camera);
  }
  loop(0);
<\/script>
</body>
</html>`
            }
        };

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tabPython').classList.toggle('active', mode === 'python');
            document.getElementById('tabHTML').classList.toggle('active', mode === 'html');
            document.getElementById('editorLabel').textContent = mode === 'python' ? '🐍 PYTHON (URSINA 3D ENGINE)' : '🌐 HTML5 / 3D WEBGL ENGINE';
            
            presetSelect.innerHTML = '';
            for (let name in presets[mode]) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                presetSelect.appendChild(opt);
            }
            loadPreset();
        }

        function loadPreset() {
            const selected = presetSelect.value;
            if (presets[currentMode][selected]) {
                editor.value = presets[currentMode][selected];
            }
        }

        setMode('python');

        // --- 3. EXEKÚCIA KÓDU ---
        function runCode() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const code = editor.value;
            log(`Spúšťam ${currentMode.toUpperCase()} render v 16:9...`, 'info');

            if (currentMode === 'python') {
                htmlFrame.style.display = "none";
                canvas.style.display = "block";

                if (!pyodideInstance) {
                    log("Python sa načítava...", "error");
                    return;
                }

                try {
                    reset3DScene();
                    pyodideInstance.runPython(code);
                    
                    function renderLoop() {
                        try {
                            if (pyodideInstance.globals.get('update')) {
                                pyodideInstance.runPython("if 'update' in globals(): update()");
                            }
                        } catch (err) {
                            log(`Python Error: ${err}`, "error");
                            return;
                        }
                        renderer.render(scene, camera);
                        animationFrameId = requestAnimationFrame(renderLoop);
                    }
                    renderLoop();
                    log("16:9 Animácia beží v plnej ostrosti!", "success");

                } catch (err) {
                    log(`Python Error: ${err}`, "error");
                }

            } else if (currentMode === 'html') {
                canvas.style.display = "none";
                htmlFrame.style.display = "block";
                htmlFrame.srcdoc = code;
                log("HTML 16:9 Scéna spustená!", "success");
            }
        }

        // --- 4. EXPORT DO MP4 (VLASTNÝ ČAS & ULTRA OSTROSŤ) ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function handleRecordClick() {
            const min = parseInt(document.getElementById('videoMin').value) || 0;
            const sec = parseInt(document.getElementById('videoSec').value) || 0;
            const totalSeconds = (min * 60) + sec;

            if (totalSeconds <= 0) {
                log("Zadaj platný čas pre video (aspoň 1 sekundu)!", "error");
                return;
            }

            const res = document.getElementById('videoRes').value;
            if (res === '1440p') {
                renderer.setSize(2560, 1440, false);
            } else {
                renderer.setSize(1920, 1080, false);
            }

            startRecording(totalSeconds);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const remainingSec = Math.floor(s % 60);
            return `${m.toString().padStart(2, '0')}:${remainingSec.toString().padStart(2, '0')}`;
        }

        function startRecording(durationSeconds) {
            if (isRecording) return;
            isRecording = true;
            recordedChunks = [];

            const btnRecord = document.getElementById('btnRecord');
            const recordBox = document.getElementById('recordBox');
            const progressFill = document.getElementById('progressFill');
            const recordTimer = document.getElementById('recordTimer');

            btnRecord.classList.add('recording');
            btnRecord.textContent = "⏺ SPRACOVÁVAM...";
            recordBox.style.display = "flex";

            let stream;
            if (currentMode === 'python') {
                stream = canvas.captureStream(60);
            } else {
                try {
                    const iframeCanvas = htmlFrame.contentDocument.querySelector('canvas');
                    stream = iframeCanvas ? iframeCanvas.captureStream(60) : canvas.captureStream(60);
                } catch(e) {
                    stream = canvas.captureStream(60);
                }
            }

            // Nastavenie extrémnej ostrosti: 35 000 000 bps (35 Mbps)
            const options = { 
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 35000000 
            };

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 35000000 });
                } catch(err) {
                    mediaRecorder = new MediaRecorder(stream);
                }
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `GPM_16x9_ULTRA_HD_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                btnRecord.classList.remove('recording');
                btnRecord.textContent = "⏺ EXPORT DO MP4";
                recordBox.style.display = "none";
                isRecording = false;
                log(`Hotovo! Video (${formatTime(durationSeconds)}) bolo v plnej kvalite stiahnuté.`, "success");
            };

            mediaRecorder.start(1000); // chunk každú sekundu

            let elapsed = 0;
            const interval = 200;
            const timer = setInterval(() => {
                elapsed += interval / 1000;
                const percent = Math.min((elapsed / durationSeconds) * 100, 100);
                progressFill.style.width = percent + "%";
                recordTimer.textContent = `${formatTime(elapsed)} / ${formatTime(durationSeconds)}`;

                if (elapsed >= durationSeconds) {
                    clearInterval(timer);
                    mediaRecorder.stop();
                }
            }, interval);
        }
    </script>
