<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLA631 - Portál spätnej väzby a podpory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .form-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            outline: none;
        }
        .tab-btn.active {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                GAMEPLA631
            </h1>
            <p class="text-slate-400">Pomôžte nám formovať budúcnosť našich hier</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex justify-center mb-8 gap-4">
            <button onclick="showForm('feedback')" id="btn-feedback" class="tab-btn active px-6 py-3 rounded-full font-semibold transition-all duration-300">
                Návrhy na zmeny (20 polí)
            </button>
            <button onclick="showForm('help')" id="btn-help" class="tab-btn px-6 py-3 rounded-full font-semibold bg-slate-800 text-slate-300 transition-all duration-300">
                Centrum pomoci (10 polí)
            </button>
        </div>

        <!-- Feedback Form (20 Fields) -->
        <div id="form-feedback" class="glass-card p-6 md:p-10 shadow-2xl">
            <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
                🎮 Dotazník vylepšenia hier
            </h2>
            <form action="https://forminit.com/f/bvrmwxdb" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Identifikácia -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">1. Herná prezývka (ID)</label>
                    <input type="text" name="player_id" required class="w-full p-3 rounded-lg form-input" placeholder="napr. ProPlayer631">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">2. Ktorú hru hodnotíte?</label>
                    <select name="game_title" class="w-full p-3 rounded-lg form-input text-slate-300">
                        <option>Roblox Experience</option>
                        <option>Mobile App</option>
                        <option>PC Alpha</option>
                    </select>
                </div>

                <!-- Mechaniky (3-8) -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">3. Hodnotenie grafiky (1-10)</label>
                    <input type="number" min="1" max="10" name="graphics_score" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">4. Plynulosť pohybu (FPS)</label>
                    <input type="text" name="movement_feel" class="w-full p-3 rounded-lg form-input" placeholder="Dobrá / Seká to">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">5. Vyváženosť zbraní/postáv</label>
                    <input type="text" name="balance_feedback" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">6. Čas načítania hry</label>
                    <input type="text" name="load_time" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">7. Intuitívnosť ovládania</label>
                    <select name="controls_ease" class="w-full p-3 rounded-lg form-input">
                        <option>Veľmi jednoduché</option>
                        <option>Priemerné</option>
                        <option>Zložité</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">8. Kvalita zvukových efektov</label>
                    <input type="text" name="audio_quality" class="w-full p-3 rounded-lg form-input">
                </div>

                <!-- Systémy (9-14) -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">9. Systém odmien (Economy)</label>
                    <input type="text" name="rewards_system" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">10. Náročnosť misií</label>
                    <input type="text" name="mission_difficulty" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">11. Častosť aktualizácií</label>
                    <input type="text" name="update_freq" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">12. Komunitné funkcie (Chat)</label>
                    <input type="text" name="social_features" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">13. Design rozhrania (UI)</label>
                    <input type="text" name="ui_design" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">14. Stabilita serverov</label>
                    <input type="text" name="server_stability" class="w-full p-3 rounded-lg form-input">
                </div>

                <!-- Detaily a nápady (15-20) -->
                <div class="md:col-span-2 space-y-2">
                    <label class="text-sm font-medium text-slate-300">15. Hlavná vec, ktorú by ste zmenili hneď teraz?</label>
                    <textarea name="top_change" rows="2" class="w-full p-3 rounded-lg form-input"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">16. Nový nápad na mapu</label>
                    <input type="text" name="map_idea" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">17. Chýbajúce kozmetické doplnky</label>
                    <input type="text" name="skins_needed" class="w-full p-3 rounded-lg form-input">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">18. Máte problémy s bugmi?</label>
                    <input type="text" name="bug_report" class="w-full p-3 rounded-lg form-input" placeholder="Popíšte stručne">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">19. Odporučili by ste hru priateľom?</label>
                    <select name="recommend" class="w-full p-3 rounded-lg form-input">
                        <option>Áno</option>
                        <option>Možno</option>
                        <option>Nie</option>
                    </select>
                </div>
                <div class="md:col-span-2 space-y-2">
                    <label class="text-sm font-medium text-slate-300">20. Priestor pre ďalšie pripomienky</label>
                    <textarea name="extra_notes" rows="2" class="w-full p-3 rounded-lg form-input"></textarea>
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95">
                        Odoslať kompletný dotazník
                    </button>
                </div>
            </form>
        </div>

        <!-- Help Center Form (10 Fields) -->
        <div id="form-help" class="glass-card p-6 md:p-10 shadow-2xl hidden">
            <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
                🛠️ Centrum pomoci
            </h2>
            <form action="https://forminit.com/f/bvrmwxdb" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">1. Vaše meno / Nick</label>
                        <input type="text" name="help_name" required class="w-full p-3 rounded-lg form-input">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">2. Kontaktný e-mail</label>
                        <input type="email" name="help_email" required class="w-full p-3 rounded-lg form-input" placeholder="email@priklad.sk">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">3. Typ problému</label>
                    <select name="help_category" class="w-full p-3 rounded-lg form-input">
                        <option>Nákup v hre</option>
                        <option>Chyba účtu</option>
                        <option>Nahásenie hráča</option>
                        <option>Technická chyba</option>
                        <option>Iné</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">4. Platforma</label>
                        <input type="text" name="help_platform" class="w-full p-3 rounded-lg form-input" placeholder="iOS, Windows, Android...">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">5. Priorita</label>
                        <select name="help_priority" class="w-full p-3 rounded-lg form-input">
                            <option>Nízka (Mám čas)</option>
                            <option>Stredná</option>
                            <option>Vysoká (Nefunguje hra)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">6. Kedy sa problém vyskytol?</label>
                    <input type="datetime-local" name="help_time" class="w-full p-3 rounded-lg form-input text-slate-400">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">7. Verzia hry (ak viete)</label>
                    <input type="text" name="help_version" class="w-full p-3 rounded-lg form-input">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">8. Predmet správy</label>
                    <input type="text" name="help_subject" class="w-full p-3 rounded-lg form-input" placeholder="Krátky názov problému">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">9. Detailný popis správy</label>
                    <textarea name="help_message" rows="4" required class="w-full p-3 rounded-lg form-input" placeholder="Napíšte nám čo najviac detailov..."></textarea>
                </div>

                <div class="space-y-2 flex items-center gap-3">
                    <input type="checkbox" name="help_consent" id="consent" required class="w-5 h-5 accent-indigo-500">
                    <label for="consent" class="text-sm text-slate-400">10. Súhlasím so spracovaním údajov pre vyriešenie požiadavky</label>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95">
                    Odoslať do Centra pomoci
                </button>
            </form>
        </div>

        <footer class="mt-12 text-center text-slate-500 text-sm">
            &copy; 2024 GAMEPLA631. Všetky práva vyhradené. <br>
            Powered by FormInit
        </footer>
    </div>

    <script>
        function showForm(type) {
            const fbForm = document.getElementById('form-feedback');
            const helpForm = document.getElementById('form-help');
            const fbBtn = document.getElementById('btn-feedback');
            const helpBtn = document.getElementById('btn-help');

            if (type === 'feedback') {
                fbForm.classList.remove('hidden');
                helpForm.classList.add('hidden');
                fbBtn.classList.add('active');
                fbBtn.classList.remove('bg-slate-800', 'text-slate-300');
                helpBtn.classList.remove('active');
                helpBtn.classList.add('bg-slate-800', 'text-slate-300');
            } else {
                fbForm.classList.add('hidden');
                helpForm.classList.remove('hidden');
                helpBtn.classList.add('active');
                helpBtn.classList.remove('bg-slate-800', 'text-slate-300');
                fbBtn.classList.remove('active');
                fbBtn.classList.add('bg-slate-800', 'text-slate-300');
            }
        }
    </script>
</body>
</html>
